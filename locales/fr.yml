    title: Garder la main
    desc: Observer les agents, comprendre leur avancement et intervenir si nécessaire.
  verify:
    title: Vérifier le résultat
    desc: Lancer l'application et tester ce qui a réellement été livré.
  note: Travaillez par deux sur un lab commun.
  roles: L’un manipule, l’autre suit les étapes et vérifie. Inversez les rôles pendant l’atelier.
  image_alt: Deux participants collaborent sur une application devant un ordinateur.

