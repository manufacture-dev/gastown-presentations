  intro: Evolve Agreement Hub with Gas Town, from the first requirement to a verified application.
  build:
    title: Build incrementally
    desc: Start with one feature, then develop several in parallel.
  control:
    title: Stay in control
    desc: Observe the agents, understand their progress, and intervene when needed.
  verify:
    title: Verify the result
    desc: Run the application and test what was actually delivered.
  note: Work in pairs on a shared lab.
  roles: One person operates, the other follows the steps and checks. Switch roles during the workshop.
  image_alt: Two participants collaborate on an application at a computer.

