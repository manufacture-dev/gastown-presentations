      em: Persists findings
    uc4:
      label: Use Case 4 — last mile
      strong: Search / Intelligence
      em: Uses schema, metadata, and risk findings
  dependencies:
    library: Saved generated clauses to library
    risk: risky / GDPR facets need persisted findings
  critical_path: Critical path
  panel_desc: Beads turn a high-level request into executable work with order, ownership, and status.
  bullets:
    dependencies: Dependencies expose the critical path.
    ready: Ready work can be executed immediately.
    blocked: Blocked work is visible instead of implicit.
    hooks: Hooks keep workers connected to active assignments.
  takeaway: Beads expose what can start now, what is blocked, and why.
  live_signal: Bead creation, ready/blocked status, dependency graph, and current hook.

