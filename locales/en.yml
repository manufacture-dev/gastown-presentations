  dogs: Deacon helpers
  rig_label: Rig operational loop
  crew: Persistent workers
  witness: Monitors Polecats · detects stuck work · nudges recovery
  polecats: Execute beads
  refinery: Merge queue · delivery convergence
  panel_desc: Gas Town supervision is layered, not a single watcher.
  bullets:
