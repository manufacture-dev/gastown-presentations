polecats:
  heading: "Polecats: parallel execution"
  assignments:
    furiosa_1: Foundations
    furiosa_2: Clause Library
    furiosa_3: Risk Reviewer
    nux: Contract Approval Workflow
    slit_1: Clause Generator
    slit_2: Search / Intelligence MVP
  flow:
    request: One product request
    beads: Scoped beads
    workers: Isolated execution workers (Polecats)
    delivery: Coordinated delivery
  panel_desc: The Mayor assigns scoped beads to Polecats, each running in its own context and branch.
  bullets:
    spawned: Spawned on demand for discrete tasks.
    isolated: Assignments stay isolated from each other.
    disappear: Polecats disappear after delivery.
    parallelism: Parallelism increases throughput, not chaos.
  takeaway: Polecats make execution scalable by distributing work across isolated contexts.
  live_signal: Multiple Polecats, branches, commits, and delivery statuses running at the same time.

supervision:
  heading: Supervision keeps execution operational
  hq_label: HQ watchdog chain
  mayor: Coordinates work
  deacon: Town watchdog · lifecycle · recovery
  daemon: mechanical heartbeat
  boot: Checks Deacon health
  dogs: Deacon helpers
  rig_label: Rig operational loop
  crew: Persistent workers
  witness: Monitors Polecats · detects stuck work · nudges recovery
  polecats: Execute beads
  refinery: Merge queue · delivery convergence
  panel_desc: Gas Town supervision is layered, not a single watcher.
  bullets:
    daemon: Daemon wakes Boot when health needs checking.
    deacon: Deacon keeps the town healthy.
    witness: Witness keeps rig execution moving.
    refinery: Refinery keeps delivery converging.
  takeaway: Supervision turns distributed execution into an operational system.
  live_signal: Deacon health, Witness status, Polecat recovery, Refinery queue, and delivery convergence.

